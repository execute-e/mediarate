services:
  #* Database
  postgres:
    image: postgres:17-alpine
    container_name: mediarate_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mediarate_app

volumes:
  pgdata:

networks:
  mediarate_app: